# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'TravelMate Dashboards'
    orgId: 1
    folder: 'TravelMate'
    folderUid: 'travelmate'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
