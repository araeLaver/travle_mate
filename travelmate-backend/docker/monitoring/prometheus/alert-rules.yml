# TravelMate Alert Rules for Prometheus

groups:
  # Application Health Alerts
  - name: application_health
    rules:
      - alert: ApplicationDown
        expr: up{job=~"travelmate-backend.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TravelMate Backend is down"
          description: "TravelMate Backend instance {{ $labels.instance }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.*", application="travelmate-backend"}[5m]))
          / sum(rate(http_server_requests_seconds_count{application="travelmate-backend"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for the last 5 minutes."

      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application="travelmate-backend"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "95th percentile response time is above 2 seconds."

  # JVM Alerts
  - name: jvm_health
    rules:
      - alert: HighHeapUsage
        expr: |
          jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage is high"
          description: "JVM heap usage is above 85% on {{ $labels.instance }}."

      - alert: HighGCPause
        expr: |
          rate(jvm_gc_pause_seconds_sum[5m]) / rate(jvm_gc_pause_seconds_count[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GC pause time"
          description: "Average GC pause time is above 500ms."

      - alert: TooManyThreads
        expr: jvm_threads_live_threads > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many JVM threads"
          description: "JVM has more than 500 live threads on {{ $labels.instance }}."

  # Database Alerts
  - name: database_health
    rules:
      - alert: HighDatabaseConnectionUsage
        expr: |
          hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connection usage"
          description: "HikariCP connection pool usage is above 80%."

      - alert: DatabaseConnectionTimeout
        expr: |
          rate(hikaricp_connections_timeout_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection timeouts occurring"
          description: "Database connection timeouts are occurring."

  # Business Metrics Alerts
  - name: business_metrics
    rules:
      - alert: HighLoginFailureRate
        expr: |
          sum(rate(travelmate_user_logins_total{status="failure"}[10m]))
          / sum(rate(travelmate_user_logins_total[10m])) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High login failure rate"
          description: "Login failure rate is above 30%."

      - alert: NFTMintingFailures
        expr: |
          sum(rate(travelmate_nft_mintings_total{status="failure"}[1h])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NFT minting failures detected"
          description: "More than 5 NFT minting failures in the last hour."

      - alert: HighAPIErrorCount
        expr: |
          sum(increase(travelmate_api_errors_total[1h])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error count"
          description: "More than 100 API errors in the last hour."

  # Infrastructure Alerts (Node Exporter)
  - name: infrastructure
    rules:
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 85% on {{ $labels.instance }}."

      - alert: HighDiskUsage
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage"
          description: "Disk usage is above 85% on {{ $labels.instance }}."
