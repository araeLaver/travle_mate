# Prometheus Configuration for Fryndo

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'travelmate-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  - "alert-rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # Fryndo Backend Application (Development)
  - job_name: 'travelmate-backend-dev'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          environment: 'development'
          application: 'travelmate-backend'
    scrape_interval: 10s

  # Fryndo Backend Application (Production)
  - job_name: 'travelmate-backend-prod'
    metrics_path: '/api/actuator/prometheus'
    scheme: https
    static_configs:
      - targets: ['api.fryndo.app']
        labels:
          environment: 'production'
          application: 'travelmate-backend'
    scrape_interval: 30s

  # Node Exporter (Host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'travelmate-server'

  # Docker containers (if using cAdvisor)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']

# Remote write configuration (optional - for long-term storage)
# remote_write:
#   - url: "http://remote-storage:9201/write"
