server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
  http2:
    enabled: true
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,livenessState,readinessState,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
    db:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:unknown}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.90, 0.95, 0.99

spring:
  application:
    name: travel-mate-backend
  main:
    allow-bean-definition-overriding: true

# OpenAPI/Swagger 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: false
  packages-to-scan: com.travelmate.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

  lifecycle:
    timeout-per-shutdown-phase: 30s

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
# 개발 환경 설정
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travelmate}
    username: ${DB_USERNAME:travelmate_user}
    # SECURITY: DB_PASSWORD 환경변수 필수 설정
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-init.sql
      continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        default_schema: travelmate
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false  # dev 프로파일에서는 Flyway 비활성화 (ddl-auto: update 사용)

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    com.travelmate: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  jwt:
    # SECURITY: JWT_SECRET 환경변수 필수 설정 (최소 32자, Base64 권장)
    # 생성 명령어: openssl rand -base64 32
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

  mail:
    enabled: ${MAIL_ENABLED:false}  # 개발환경에서는 비활성화

  redis:
    enabled: true  # 개발환경에서는 Redis 활성화

  oauth:
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  file:
    upload:
      path: ./uploads/
      max-size: 10485760  # 10MB in bytes

  cors:
    allowed-origins: http://localhost:3000,http://localhost:8081

  security:
    rate-limit:
      enabled: false  # 개발환경에서는 비활성화
      requests-per-minute: 60
      auth-requests-per-minute: 10
    xss:
      enabled: true
    audit:
      enabled: true

# Sentry 설정 (개발)
sentry:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}
  environment: development
  traces-sample-rate: 0.1
  logging:
    minimum-event-level: warn
    minimum-breadcrumb-level: info

# 블록체인 설정 (Polygon)
blockchain:
  enabled: ${BLOCKCHAIN_ENABLED:false}
  polygon:
    rpc-url: ${POLYGON_RPC_URL:https://polygon-amoy.g.alchemy.com/v2/demo}
    chain-id: ${POLYGON_CHAIN_ID:80002}
    contract-address: ${NFT_CONTRACT_ADDRESS:}
    private-key: ${BLOCKCHAIN_PRIVATE_KEY:}

# IPFS 설정
ipfs:
  enabled: ${IPFS_ENABLED:false}
  gateway-url: ${IPFS_GATEWAY_URL:https://ipfs.io/ipfs/}
  api-url: ${IPFS_API_URL:}
  api-key: ${IPFS_API_KEY:}

# AWS 설정 (개발)
aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  use-default-credentials: true
  cloudfront:
    distribution-id: ${CLOUDFRONT_DISTRIBUTION_ID:}
    key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID:}
    private-key-path: ${CLOUDFRONT_PRIVATE_KEY_PATH:}

# CDN 설정 (개발)
cdn:
  enabled: ${CDN_ENABLED:false}
  base-url: ${CDN_BASE_URL:}
  image-path: /images
  static-path: /static
  cache-duration: 86400

# Toss Payments 설정
payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY:test_sk_}
    client-key: ${TOSS_CLIENT_KEY:test_ck_}
    api-url: https://api.tosspayments.com/v1

# SMS 본인인증 설정
sms:
  provider: ${SMS_PROVIDER:mock}
  expiration-minutes: 5
  max-attempts: 5

---
# 운영 환경 설정 (PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod

  # Redis/Elasticsearch/Mail/Sentry 자동설정 비활성화 (Koyeb 무료 플랜에서 미사용)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration
      - io.sentry.spring.boot.jakarta.SentryAutoConfiguration
      - org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # Spring Boot 시작 최적화
  main:
    lazy-initialization: true
    banner-mode: off
    allow-bean-definition-overriding: true

  jmx:
    enabled: false

  # JPA 초기화 지연
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travelmate}?sslmode=require&options=-c%20search_path%3Dtravelmate,public}
    username: ${DB_USERNAME:travelmate_user}
    # SECURITY: 운영환경에서 DB_PASSWORD 환경변수 필수 설정
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 120000
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000
    continue-on-error: false

  sql:
    init:
      mode: never
      schema-locations: classpath:schema-init.sql
      continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 스키마 자동 변경 금지
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: travelmate
        format_sql: false
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        cache:
          use_second_level_cache: false
          use_query_cache: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: travelmate
    default-schema: travelmate
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 6
    baseline-description: Hibernate-managed schema before Flyway

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
      
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    jedis:
      pool:
        max-active: 10
        max-idle: 5
        min-idle: 1

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
    metrics:
      enabled: false
    prometheus:
      enabled: false
  health:
    redis:
      enabled: false
    elasticsearch:
      enabled: false
    mail:
      enabled: false
    db:
      enabled: false

logging:
  level:
    root: WARN
    com.travelmate: INFO
    org.springframework: WARN
    org.hibernate: ERROR
    org.apache: ERROR
    com.zaxxer.hikari: WARN
  pattern:
    console: '%d{HH:mm:ss} %-5level %logger{20} - %msg%n'

app:
  jwt:
    secret: ${JWT_SECRET}  # 필수! 운영환경에서 반드시 설정 (최소 32자)
    expiration: ${JWT_EXPIRATION:3600000}  # 1 hour
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

  mail:
    enabled: ${MAIL_ENABLED:false}  # MVP: 메일 비활성화 (필요시 환경변수로 활성화)

  redis:
    enabled: false  # Koyeb 무료 플랜에서 Redis 미사용

  oauth:
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}

  frontend:
    url: ${FRONTEND_URL:https://various-belva-untab-1a59bee2.koyeb.app}

  file:
    upload:
      path: ${FILE_UPLOAD_PATH:/app/uploads/}
      max-size: 5242880  # 5MB in bytes

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://various-belva-untab-1a59bee2.koyeb.app}

  security:
    rate-limit:
      enabled: true
      default-requests-per-minute: 60
      login-requests-per-minute: 5
      api-requests-per-minute: 30
      upload-requests-per-minute: 10
    xss:
      enabled: true
    audit:
      enabled: true
    headers:
      # SECURITY: CSP 정책 강화 - unsafe-eval 제거, unsafe-inline은 style에만 허용 (CSS-in-JS 지원)
      # 프론트엔드에서 nonce 기반 스크립트 로딩으로 전환 권장
      content-security-policy: "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://www.google-analytics.com https://accounts.google.com https://apis.google.com https://t1.kakaocdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: https://www.google-analytics.com https://analytics.google.com https://kapi.kakao.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# AWS 설정 (운영)
aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  use-default-credentials: false
  cloudfront:
    distribution-id: ${CLOUDFRONT_DISTRIBUTION_ID:}
    key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID:}
    private-key-path: ${CLOUDFRONT_PRIVATE_KEY_PATH:}

# CDN 설정 (운영)
cdn:
  enabled: ${CDN_ENABLED:false}
  base-url: ${CDN_BASE_URL:}
  image-path: /images
  static-path: /static
  cache-duration: 604800

# Toss Payments 설정 (운영)
payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY}
    client-key: ${TOSS_CLIENT_KEY}
    api-url: https://api.tosspayments.com/v1

# Sentry 설정 (운영) - 선택적 설정
sentry:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}
  environment: production
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.2}
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: warn
  send-default-pii: false

---
# 테스트 환경 설정
spring:
  config:
    activate:
      on-profile: test
      
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false  # 테스트에서는 H2 + create-drop 사용

logging:
  level:
    com.travelmate: WARN
    org.springframework: WARN
    org.hibernate: WARN

app:
  jwt:
    secret: testSecretKey123
    expiration: 3600000
