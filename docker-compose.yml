version: '3.8'

# TravelMate Development Docker Compose
# Usage: docker-compose up -d

services:
  # ===================
  # Backend API Server
  # ===================
  backend:
    build:
      context: ./travelmate-backend
      dockerfile: Dockerfile
    container_name: travelmate-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - DB_URL=jdbc:postgresql://postgres:5432/travelmate
      - DB_USERNAME=${DB_USERNAME:-travelmate_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FCM_CREDENTIALS_PATH=${FCM_CREDENTIALS_PATH:-}
      - TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY:-}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY:-}
    volumes:
      - ./uploads:/app/uploads
      - ./logs/backend:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - travelmate-network

  # ===================
  # Frontend Web App
  # ===================
  frontend:
    build:
      context: ./travelmate-web
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8080/api}
        - REACT_APP_WS_URL=${REACT_APP_WS_URL:-ws://localhost:8080/ws}
        - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID:-}
        - REACT_APP_KAKAO_APP_KEY=${REACT_APP_KAKAO_APP_KEY:-}
        - REACT_APP_NAVER_CLIENT_ID=${REACT_APP_NAVER_CLIENT_ID:-}
        - REACT_APP_KAKAO_MAP_API_KEY=${REACT_APP_KAKAO_MAP_API_KEY:-}
    container_name: travelmate-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - travelmate-network

  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:15-alpine
    container_name: travelmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelmate
      # SECURITY: 환경변수 필수 설정
      POSTGRES_USER: ${DB_USERNAME:-travelmate_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-travelmate_user} -d travelmate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - travelmate-network

  # ===================
  # Redis Cache
  # ===================
  redis:
    image: redis:7-alpine
    container_name: travelmate-redis
    restart: unless-stopped
    # SECURITY: Redis 비밀번호 필수 설정
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelmate-network

  # ===================
  # Adminer (DB Admin UI)
  # ===================
  adminer:
    image: adminer:latest
    container_name: travelmate-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    profiles:
      - dev
    networks:
      - travelmate-network

  # ===================
  # Redis Commander (Redis Admin UI)
  # ===================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: travelmate-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    profiles:
      - dev
    networks:
      - travelmate-network

networks:
  travelmate-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
