# Logstash Pipeline for Fryndo

input {
  # Beats input (from Filebeat)
  beats {
    port => 5044
    client_inactivity_timeout => 300
  }

  # TCP input for direct logging
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse Spring Boot logs
  if [fields][service] == "travelmate-backend" or [container][name] =~ "travelmate-backend" {

    # Parse standard Spring Boot log format
    grok {
      match => {
        "message" => [
          # Standard format: timestamp [thread] level logger - message
          "%{TIMESTAMP_ISO8601:log_timestamp}\s+\[%{DATA:thread}\]\s+%{LOGLEVEL:level}\s+%{DATA:logger}\s+-\s+%{GREEDYDATA:log_message}",
          # Alternative format
          "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:level}\s+%{POSINT:pid}\s+---\s+\[%{DATA:thread}\]\s+%{DATA:logger}\s+:\s+%{GREEDYDATA:log_message}",
          # Fallback - just get the message
          "%{GREEDYDATA:log_message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure"]
    }

    # Parse timestamp
    date {
      match => [ "log_timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss" ]
      target => "@timestamp"
      timezone => "Asia/Seoul"
    }

    # Extract request details from HTTP logs
    if [log_message] =~ "HTTP" or [log_message] =~ "request" {
      grok {
        match => {
          "log_message" => [
            "%{WORD:http_method}\s+%{URIPATH:request_path}(?:\?%{DATA:query_string})?\s+%{NUMBER:status_code:int}",
            "%{IP:client_ip}\s+-\s+%{WORD:http_method}\s+%{URIPATH:request_path}\s+%{NUMBER:status_code:int}\s+%{NUMBER:response_time_ms:float}"
          ]
        }
        tag_on_failure => []
      }
    }

    # Extract exception information
    if [log_message] =~ "Exception" or [log_message] =~ "Error" or [level] == "ERROR" {
      mutate {
        add_tag => ["error"]
        add_field => { "error_type" => "application_error" }
      }

      grok {
        match => {
          "log_message" => "%{DATA:exception_class}:\s+%{GREEDYDATA:exception_message}"
        }
        tag_on_failure => []
      }
    }

    # Extract SQL query information
    if [logger] =~ "hibernate" or [log_message] =~ "SQL" {
      mutate {
        add_tag => ["sql"]
      }
    }

    # Extract security events
    if [logger] =~ "security" or [log_message] =~ "authentication" or [log_message] =~ "authorization" {
      mutate {
        add_tag => ["security"]
      }
    }

    # Extract user ID if present
    if [log_message] =~ "userId" or [log_message] =~ "user_id" {
      grok {
        match => {
          "log_message" => "(?:userId|user_id)[=:]?\s*%{NUMBER:user_id:int}"
        }
        tag_on_failure => []
      }
    }

    # Add service metadata
    mutate {
      add_field => {
        "service" => "travelmate-backend"
        "environment" => "${ENVIRONMENT:dev}"
      }
    }
  }

  # Parse nginx access logs
  if [fields][service] == "nginx" or [container][name] =~ "nginx" {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:timestamp}\] "%{WORD:http_method} %{URIPATH:request_path}(?:\?%{DATA:query_string})? HTTP/%{NUMBER:http_version}" %{NUMBER:status_code:int} %{NUMBER:bytes_sent:int} "%{DATA:referrer}" "%{DATA:user_agent}" rt=%{NUMBER:response_time:float}'
      }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }

    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
    }

    geoip {
      source => "client_ip"
      target => "geoip"
      database => "/usr/share/logstash/GeoLite2-City.mmdb"
      add_tag => ["geoip"]
      tag_on_failure => []
    }

    useragent {
      source => "user_agent"
      target => "ua"
    }
  }

  # Common processing
  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }

  # Add processing timestamp
  ruby {
    code => "event.set('processed_at', Time.now.utc.iso8601(3))"
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "travelmate-logs-%{+YYYY.MM.dd}"
    template_name => "travelmate-logs"
    template_overwrite => true

    # ILM (Index Lifecycle Management) settings
    ilm_enabled => true
    ilm_rollover_alias => "travelmate-logs"
    ilm_pattern => "000001"
    ilm_policy => "travelmate-logs-policy"
  }

  # Debug output (disable in production)
  # stdout {
  #   codec => rubydebug
  # }
}
