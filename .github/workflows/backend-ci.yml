name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'travelmate-node-backend/**'
      - 'Dockerfile.node'
      - 'fly.toml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'travelmate-node-backend/**'
      - 'Dockerfile.node'
      - 'fly.toml'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: travelmate-node-backend/package-lock.json

    - name: Install dependencies
      working-directory: ./travelmate-node-backend
      run: npm ci

    - name: Build backend
      working-directory: ./travelmate-node-backend
      run: npm run build

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v6
      with:
        name: backend-dist
        path: travelmate-node-backend/dist
        retention-days: 7
