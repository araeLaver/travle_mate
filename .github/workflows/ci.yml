name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Frontend Tests and Build
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: travelmate-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: travelmate-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run unit tests
        run: npm test -- --watchAll=false --coverage
        env:
          CI: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          directory: travelmate-web/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build
        env:
          CI: false  # Allow warnings in build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: travelmate-web/build
          retention-days: 7

  # Backend Tests and Build
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: travelmate-backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travelmate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test -B
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/travelmate_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

      - name: Generate test report
        run: mvn jacoco:report -B
        if: always()

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          directory: travelmate-backend/target/site/jacoco
          flags: backend
          fail_ci_if_error: false
        if: always()

      - name: Build JAR
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-jar
          path: travelmate-backend/target/*.jar
          retention-days: 7

  # E2E Tests (optional, runs on main branch only)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: travelmate-web/package-lock.json

      - name: Install dependencies
        working-directory: travelmate-web
        run: npm ci --legacy-peer-deps

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: travelmate-web
          build: npm run build
          start: npx serve -s build -l 3000
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
        env:
          CI: true

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cypress-screenshots
          path: travelmate-web/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cypress-videos
          path: travelmate-web/cypress/videos
          retention-days: 7
