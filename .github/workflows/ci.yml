name: CI

on:
  push:
    branches: [main, develop, 'auto/**']
  pull_request:
    branches: [main, develop]

jobs:
  # Frontend Tests and Build
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: travelmate-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: travelmate-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run unit tests
        run: npx react-scripts test --watchAll=false --coverage --passWithNoTests
        env:
          CI: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          directory: travelmate-web/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build
        env:
          CI: false  # Allow warnings in build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: travelmate-web/build
          retention-days: 7

  # Backend TypeScript Build
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: travelmate-node-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: travelmate-node-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-dist
          path: travelmate-node-backend/dist
          retention-days: 7

  # E2E Tests (optional, runs on main branch only)
  # continue-on-error: E2E tests run against static build without a real backend,
  # so API-dependent tests will time out until a proper test backend is configured.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: travelmate-web/package-lock.json

      - name: Install dependencies
        working-directory: travelmate-web
        run: npm ci --legacy-peer-deps

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: travelmate-web
          build: npm run build
          start: npx serve -s build -l 3000
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
        env:
          CI: true

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cypress-screenshots
          path: travelmate-web/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cypress-videos
          path: travelmate-web/cypress/videos
          retention-days: 7
