name: Mobile CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'travelmate-mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'travelmate-mobile/**'

env:
  NODE_VERSION: '20'

defaults:
  run:
    working-directory: travelmate-mobile

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: travelmate-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: travelmate-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --coverage --watchAll=false

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: travelmate-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Validate EAS project configuration
        run: |
          PROJECT_ID=$(node -e "try{const a=require('./app.json');console.log(a.expo&&a.expo.extra&&a.expo.extra.eas&&a.expo.extra.eas.projectId||'')}catch(e){console.log('')}")
          UUID_RE='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          if [[ "$PROJECT_ID" =~ $UUID_RE ]]; then
            echo "EAS_CONFIGURED=true" >> $GITHUB_ENV
            echo "✅ EAS projectId configured: $PROJECT_ID"
          else
            echo "EAS_CONFIGURED=false" >> $GITHUB_ENV
            echo "⚠️  EAS projectId is not a valid UUID (found: '$PROJECT_ID'). Skipping EAS build." | tee -a $GITHUB_STEP_SUMMARY
            echo "To enable EAS builds, run: eas init  — then update extra.eas.projectId in app.json" | tee -a $GITHUB_STEP_SUMMARY
          fi

      - name: Patch expo-modules-core for EAS compatibility
        if: env.EAS_CONFIGURED == 'true'
        run: |
          CORE_PKG="node_modules/expo-modules-core/package.json"
          if [ -f "$CORE_PKG" ]; then
            MAIN_FIELD=$(node -e "const p=require('./$CORE_PKG'); console.log(p.main||'')")
            if [[ "$MAIN_FIELD" == *.ts ]]; then
              echo 'module.exports = {};' > node_modules/expo-modules-core/index.compat.js
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('node_modules/expo-modules-core/package.json', 'utf-8'));
                pkg.main = 'index.compat.js';
                fs.writeFileSync('node_modules/expo-modules-core/package.json', JSON.stringify(pkg, null, 2));
                console.log('Patched expo-modules-core main -> index.compat.js');
              "
            else
              echo "expo-modules-core main OK: $MAIN_FIELD"
            fi
          fi

      - name: Setup EAS
        if: env.EAS_CONFIGURED == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (Preview)
        if: env.EAS_CONFIGURED == 'true' && github.ref == 'refs/heads/develop'
        run: eas build --platform android --profile preview --non-interactive

      - name: Build Android (Production)
        if: env.EAS_CONFIGURED == 'true' && github.ref == 'refs/heads/main'
        run: eas build --platform android --profile production --non-interactive

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: travelmate-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate EAS project configuration
        run: |
          PROJECT_ID=$(node -e "try{const a=require('./app.json');console.log(a.expo&&a.expo.extra&&a.expo.extra.eas&&a.expo.extra.eas.projectId||'')}catch(e){console.log('')}")
          UUID_RE='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          if [[ "$PROJECT_ID" =~ $UUID_RE ]]; then
            echo "EAS_CONFIGURED=true" >> $GITHUB_ENV
            echo "✅ EAS projectId configured: $PROJECT_ID"
          else
            echo "EAS_CONFIGURED=false" >> $GITHUB_ENV
            echo "⚠️  EAS projectId is not a valid UUID (found: '$PROJECT_ID'). Skipping EAS build." | tee -a $GITHUB_STEP_SUMMARY
            echo "To enable EAS builds, run: eas init  — then update extra.eas.projectId in app.json" | tee -a $GITHUB_STEP_SUMMARY
          fi

      - name: Patch expo-modules-core for EAS compatibility
        if: env.EAS_CONFIGURED == 'true'
        run: |
          CORE_PKG="node_modules/expo-modules-core/package.json"
          if [ -f "$CORE_PKG" ]; then
            MAIN_FIELD=$(node -e "const p=require('./$CORE_PKG'); console.log(p.main||'')")
            if [[ "$MAIN_FIELD" == *.ts ]]; then
              echo 'module.exports = {};' > node_modules/expo-modules-core/index.compat.js
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('node_modules/expo-modules-core/package.json', 'utf-8'));
                pkg.main = 'index.compat.js';
                fs.writeFileSync('node_modules/expo-modules-core/package.json', JSON.stringify(pkg, null, 2));
                console.log('Patched expo-modules-core main -> index.compat.js');
              "
            else
              echo "expo-modules-core main OK: $MAIN_FIELD"
            fi
          fi

      - name: Setup EAS
        if: env.EAS_CONFIGURED == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (Preview)
        if: env.EAS_CONFIGURED == 'true' && github.ref == 'refs/heads/develop'
        run: eas build --platform ios --profile preview --non-interactive

      - name: Build iOS (Production)
        if: env.EAS_CONFIGURED == 'true' && github.ref == 'refs/heads/main'
        run: eas build --platform ios --profile production --non-interactive

  submit-android:
    name: Submit to Play Store
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: travelmate-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate EAS project configuration
        run: |
          PROJECT_ID=$(node -e "try{const a=require('./app.json');console.log(a.expo&&a.expo.extra&&a.expo.extra.eas&&a.expo.extra.eas.projectId||'')}catch(e){console.log('')}")
          UUID_RE='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          if [[ "$PROJECT_ID" =~ $UUID_RE ]]; then
            echo "EAS_CONFIGURED=true" >> $GITHUB_ENV
            echo "✅ EAS projectId configured: $PROJECT_ID"
          else
            echo "EAS_CONFIGURED=false" >> $GITHUB_ENV
            echo "⚠️  EAS projectId is not a valid UUID (found: '$PROJECT_ID'). Skipping Play Store submission." | tee -a $GITHUB_STEP_SUMMARY
          fi

      - name: Setup EAS
        if: env.EAS_CONFIGURED == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Play Store
        if: env.EAS_CONFIGURED == 'true'
        run: eas submit --platform android --latest --non-interactive

  submit-ios:
    name: Submit to App Store
    runs-on: ubuntu-latest
    needs: build-ios
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: travelmate-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate EAS project configuration
        run: |
          PROJECT_ID=$(node -e "try{const a=require('./app.json');console.log(a.expo&&a.expo.extra&&a.expo.extra.eas&&a.expo.extra.eas.projectId||'')}catch(e){console.log('')}")
          UUID_RE='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          if [[ "$PROJECT_ID" =~ $UUID_RE ]]; then
            echo "EAS_CONFIGURED=true" >> $GITHUB_ENV
            echo "✅ EAS projectId configured: $PROJECT_ID"
          else
            echo "EAS_CONFIGURED=false" >> $GITHUB_ENV
            echo "⚠️  EAS projectId is not a valid UUID (found: '$PROJECT_ID'). Skipping App Store submission." | tee -a $GITHUB_STEP_SUMMARY
          fi

      - name: Setup EAS
        if: env.EAS_CONFIGURED == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to App Store
        if: env.EAS_CONFIGURED == 'true'
        run: eas submit --platform ios --latest --non-interactive
