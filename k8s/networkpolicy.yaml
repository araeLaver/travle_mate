# NetworkPolicy — Pod 간 네트워크 트래픽 최소 권한 제어
# 기본 정책: deny-all 후 명시적 허용 규칙만 적용
---
# Backend: ingress controller + frontend에서만 접근 가능
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: travelmate-backend-netpol
  namespace: travelmate
spec:
  podSelector:
    matchLabels:
      app: travelmate-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller에서 허용
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    # Frontend에서 직접 호출 (WebSocket 포함)
    - from:
        - podSelector:
            matchLabels:
              app: travelmate-frontend
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus 스크레이핑 허용
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # 외부 API (OpenAI, FCM, Toss 등) - DNS + HTTPS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
---
# Frontend: ingress controller에서만 접근 가능
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: travelmate-frontend-netpol
  namespace: travelmate
spec:
  podSelector:
    matchLabels:
      app: travelmate-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    # Backend API 호출
    - to:
        - podSelector:
            matchLabels:
              app: travelmate-backend
      ports:
        - protocol: TCP
          port: 8080
    # DNS
    - ports:
        - protocol: UDP
          port: 53
---
# PostgreSQL: backend에서만 접근 가능
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-netpol
  namespace: travelmate
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: travelmate-backend
      ports:
        - protocol: TCP
          port: 5432
    # postgres-exporter (monitoring namespace)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - ports:
        - protocol: UDP
          port: 53
---
# Redis: backend에서만 접근 가능
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-netpol
  namespace: travelmate
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: travelmate-backend
      ports:
        - protocol: TCP
          port: 6379
    # redis-exporter (monitoring namespace)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - ports:
        - protocol: UDP
          port: 53
