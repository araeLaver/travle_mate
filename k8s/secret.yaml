# =============================================================================
# SECURITY WARNING: 이 파일은 템플릿입니다!
# 실제 시크릿 값을 이 파일에 직접 입력하지 마세요.
# =============================================================================
#
# 프로덕션 시크릿 생성 방법:
#
# 방법 1: kubectl 명령어 사용 (권장)
# kubectl create secret generic travelmate-secrets \
#   --from-literal=JWT_SECRET=$(openssl rand -base64 32) \
#   --from-literal=DB_USERNAME=your_db_user \
#   --from-literal=DB_PASSWORD=$(openssl rand -base64 24) \
#   --from-literal=REDIS_PASSWORD=$(openssl rand -base64 16) \
#   -n travelmate
#
# 방법 2: Sealed Secrets 사용 (GitOps 권장)
# kubeseal --format=yaml < secret-raw.yaml > sealed-secret.yaml
#
# 방법 3: External Secrets Operator + HashiCorp Vault 사용
# https://external-secrets.io/
#
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: travelmate-secrets
  namespace: travelmate
  labels:
    app: travelmate
    component: secrets
  annotations:
    # SECURITY: 이 파일은 템플릿입니다. 실제 값을 커밋하지 마세요.
    template: "true"
    description: "TravelMate 애플리케이션 시크릿 템플릿"
type: Opaque
stringData:
  # =============================================================================
  # IMPORTANT: 아래 값들은 반드시 실제 배포 전에 교체해야 합니다!
  # 플레이스홀더 값으로 배포 시 애플리케이션이 시작되지 않습니다.
  # =============================================================================

  # JWT 시크릿 (최소 32자, Base64 권장)
  # 생성: openssl rand -base64 32
  JWT_SECRET: "__REPLACE_JWT_SECRET__"

  # 데이터베이스 인증 정보
  DB_USERNAME: "__REPLACE_DB_USERNAME__"
  DB_PASSWORD: "__REPLACE_DB_PASSWORD__"
  DB_URL: "jdbc:postgresql://postgres-service:5432/travelmate"

  # Redis 설정
  REDIS_HOST: "redis-service"
  REDIS_PASSWORD: "__REPLACE_REDIS_PASSWORD__"

  # 외부 서비스 API 키 (선택)
  OPENAI_API_KEY: ""
  SENTRY_DSN: ""

---
# =============================================================================
# 시크릿 검증용 ConfigMap
# 애플리케이션 시작 시 필수 시크릿이 설정되었는지 확인
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: travelmate-secret-validation
  namespace: travelmate
data:
  validate-secrets.sh: |
    #!/bin/sh
    set -e

    echo "Validating required secrets..."

    # 필수 시크릿 검증
    if [ "$JWT_SECRET" = "__REPLACE_JWT_SECRET__" ] || [ -z "$JWT_SECRET" ]; then
      echo "ERROR: JWT_SECRET is not configured!"
      exit 1
    fi

    if [ "$DB_PASSWORD" = "__REPLACE_DB_PASSWORD__" ] || [ -z "$DB_PASSWORD" ]; then
      echo "ERROR: DB_PASSWORD is not configured!"
      exit 1
    fi

    # JWT_SECRET 길이 검증 (최소 32자)
    JWT_LENGTH=$(echo -n "$JWT_SECRET" | wc -c)
    if [ "$JWT_LENGTH" -lt 32 ]; then
      echo "ERROR: JWT_SECRET must be at least 32 characters (current: $JWT_LENGTH)"
      exit 1
    fi

    echo "All secrets validated successfully!"
