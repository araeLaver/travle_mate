apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelmate-ingress
  namespace: travelmate
  annotations:
    # kubernetes.io/ingress.class is deprecated since K8s 1.18; use spec.ingressClassName instead
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - travelmate.app
        - api.travelmate.app
      secretName: travelmate-tls
  rules:
    - host: travelmate.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    - host: api.travelmate.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
---
# WebSocket Ingress for real-time chat
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelmate-ws-ingress
  namespace: travelmate
  annotations:
    # kubernetes.io/ingress.class is deprecated since K8s 1.18; use spec.ingressClassName instead
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.travelmate.app
      secretName: travelmate-tls
  rules:
    - host: api.travelmate.app
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
